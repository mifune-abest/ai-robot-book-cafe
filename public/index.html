<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17324d" />
    <meta name="color-scheme" content="light" />
    <title>AI ROBOT BOOK CAFE</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">ないようへ すすむ</a>

    <header class="site-header" id="site-header">
      <div class="brand" aria-label="AI ROBOT BOOK CAFE">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span class="brand-name">ROBOT BOOK CAFE</span>
        <span class="test-mode-badge" id="test-mode-badge" hidden>おとなテスト</span>
      </div>
      <p class="route-name" id="route-name"></p>
      <button class="header-action" id="restart-button" type="button" hidden>
        はじめから
      </button>
    </header>

    <main id="app" class="app-main" tabindex="-1" aria-live="polite">
      <section class="screen screen--center">
        <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1>じゅんび<ruby data-furigana="true">中<rt data-reading="ちゅう" aria-hidden="true"></rt></ruby>…</h1>
        <p class="lead"><ruby data-furigana="true">画面<rt data-reading="がめん" aria-hidden="true"></rt></ruby>が かわらないときは、スタッフに アプリを きどうしてもらってね</p>
        <div class="actions">
          <a class="button" href="http://127.0.0.1:4310/">きどうした アプリを ひらく</a>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <p class="noscript">このアプリを<ruby data-furigana="true">使<rt data-reading="つか" aria-hidden="true"></rt></ruby>うにはJavaScriptを<ruby data-furigana="true">有効<rt data-reading="ゆうこう" aria-hidden="true"></rt></ruby>にしてください。</p>
    </noscript>

    <script src="./file-guard.js"></script>
  </body>
</html>
